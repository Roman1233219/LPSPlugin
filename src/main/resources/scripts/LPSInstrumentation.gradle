
/**
 * LPS Process Logger - Статическая инструментация.
 */

def setupInstrumentation = {
    if (!project.extensions.findByName('android')) return

    def scriptFile = file(buildscript.sourceFile)
    def scriptDir = scriptFile.parentFile
    project.android.sourceSets.main.java.srcDirs += scriptDir

    if (project.extensions.findByName('androidComponents')) {
        project.androidComponents.onVariants(project.androidComponents.selector().all()) { variant ->
            
            try {
                def factoryClass = Class.forName("com.example.lpsplugin.LPSAsmFactory")
                
                def projectClassLoader = variant.instrumentation.class.classLoader
                def scopeClass = projectClassLoader.loadClass('com.android.build.api.instrumentation.InstrumentationScope')
                def modeClass = projectClassLoader.loadClass('com.android.build.api.instrumentation.FramesComputationMode')

                variant.instrumentation.transformClassesWith(factoryClass, scopeClass.ALL) {}
                variant.instrumentation.setAsmFramesComputationMode(modeClass.COPY_FRAMES)
                
                project.logger.lifecycle("LPS: Static instrumentation injected for variant \${variant.name}")
            } catch (ClassNotFoundException e) {
                project.logger.error("LPS: Plugin classes not found in classpath. Make sure the plugin is applied.")
            } catch (Exception e) {
                project.logger.error("LPS: Failed to inject: " + e.toString())
            }
        }
    }
}

setupInstrumentation()
